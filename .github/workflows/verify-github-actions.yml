name: GitHub Actions 動作確認

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      note:
        description: "動作確認メモ（任意）"
        required: false
        default: "manual dispatch"

permissions:
  contents: read

jobs:
  test:
    name: テストと決定論的検証
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 実行コンテキストを表示
        run: |
          echo "actor      : ${{ github.actor }}"
          echo "event_name : ${{ github.event_name }}"
          echo "ref        : ${{ github.ref }}"
          echo "sha        : ${{ github.sha }}"
          echo "run_id     : ${{ github.run_id }}"
          echo "input_note : ${{ inputs.note }}"

      - name: ResearchOS 決定論的スキーマ・参照整合性検証
        run: |
          python3 scripts/validate_researchos.py

      - name: ResearchOS 回帰テスト（独立監査 Findings の固定）
        run: |
          python3 -m unittest discover -s tests -v

      - name: GitSwarm ベンチマーク再現性チェック
        run: |
          python3 gitswarm/benchmarks/benchmark.py --check

      - name: ガバナンス否定プローブ（G1-G4）
        run: |
          python3 verifications/prp001_governance_probes.py

      - name: ジョブサマリ（test）
        if: always()
        run: |
          {
            echo "## GitHub Actions 動作確認 — test"
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| イベント | \`${{ github.event_name }}\` |"
            echo "| ブランチ | \`${{ github.ref_name }}\` |"
            echo "| 実行番号 | ${{ github.run_number }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  guard:
    name: ガバナンス検査と着地ゲート
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: []  # PRP-002 A8: don't skip guard when test fails — run independently
    if: always()
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ResearchOS ガバナンス検査（propose ステージ）
        run: |
          set -euo pipefail
          python3 scripts/researchos_guard.py check-policy
          python3 scripts/researchos_guard.py check-append-only
          python3 scripts/researchos_guard.py check-commits --branch "${GITHUB_REF_NAME}" --stage propose
          python3 scripts/researchos_guard.py check-authorship

      - name: ガバナンス着地ゲート（main のみ）
        if: github.ref_name == 'main'
        run: |
          set -euo pipefail
          python3 scripts/researchos_guard.py check-commits --branch main --stage land
          python3 scripts/validate_researchos.py --quiet
          echo "land gate PASS for main"

      - name: 次セッションへの引き継ぎを生成
        if: always()
        run: |
          python3 scripts/researchos_next.py --write > /dev/null || true
          cat state/NEXT_SESSION.md >> "$GITHUB_STEP_SUMMARY" || true

  artifacts:
    name: 成果物とサマリ
    runs-on: ubuntu-latest
    needs: [test, guard]
    if: always()
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 簡単な計算テスト
        run: |
          set -euo pipefail
          total=0
          for i in 1 2 3 4 5; do total=$((total + i)); done
          echo "1..5 の合計 = ${total}"
          test "${total}" -eq 15

      - name: 成果物を作成
        run: |
          {
            echo "# GitHub Actions 動作確認"
            echo "- 日時(UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- イベント: ${{ github.event_name }}"
            echo "- ブランチ: ${{ github.ref_name }}"
            echo "- コミット: ${{ github.sha }}"
          } > verify-output.txt
          cat verify-output.txt

      - name: ジョブサマリ
        run: |
          {
            echo "## GitHub Actions 動作確認 — artifacts"
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| イベント | \`${{ github.event_name }}\` |"
            echo "| ブランチ | \`${{ github.ref_name }}\` |"
            echo "| 実行番号 | ${{ github.run_number }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: verify-artifact
          path: verify-output.txt
          retention-days: 7
